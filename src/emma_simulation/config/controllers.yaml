controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    # Not named gripper_controller: that is the gripper joint's name.
    gripper_action_controller:
      type: parallel_gripper_action_controller/GripperActionController
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController
      # The controller publishes odom -> base_footprint on ~/tf_odometry, not /tf.
      # Controllers ignore the process's global remaps, so remap per controller.
      node_options_args: ["-r", "~/tf_odometry:=/tf"]

arm_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true

gripper_action_controller:
  ros__parameters:
    joint: gripper_controller

mecanum_drive_controller:
  ros__parameters:
    reference_timeout: 0.5  # s; the base stops if commands stop.
    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    # Must match the wheels in emma.urdf.xacro. lx + ly averages the front/rear and
    # left/right wheel offsets; the offset re-centres them, since the base mesh is
    # not centred on base_footprint.
    kinematics:
      wheels_radius: 0.04
      sum_of_robot_center_projection_on_X_Y_axis: 0.2057
      base_frame_offset: {x: 0.0055, y: -0.0043, theta: 0.0}
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
