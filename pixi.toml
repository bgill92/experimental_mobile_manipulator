[workspace]
authors = ["Bilal Gill <5256190+bgill92@users.noreply.github.com>"]
license = "MIT"
license-file = "LICENSE"
channels = ["https://prefix.dev/robostack-lyrical", "conda-forge"]
name = "experimental_mobile_manipulator"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Only the description packages of the upstream submodules build; the rest of those repos targets older ROS distros.
build = "colcon build --symlink-install --base-paths src external_packages/myagv_ros2/myagv_description external_packages/mycobot_ros2/mycobot_description"
# Converts the URDF to MJCF in src/emma_simulation/mujoco/; rerun after changing the URDF or mujoco_inputs.xml.
gen-mjcf = { cmd = "bash src/emma_simulation/scripts/gen_mjcf.sh", depends-on = ["build"] }
# Robot model in RViz with joint sliders, no physics. Extra args pass through, e.g. `pixi run display model:=arm`.
display = { cmd = "bash -c 'source install/setup.bash && ros2 launch emma_description display.launch.py \"$@\"' --", depends-on = ["build"] }
# Extra args pass through to the launch file, e.g. `pixi run sim headless:=true`. Builds first so
# newly generated MJCF files are installed.
sim = { cmd = "bash -c 'source install/setup.bash && ros2 launch emma_simulation sim.launch.py \"$@\"' --", depends-on = ["build"] }

[dependencies]
ros-lyrical-desktop = ">=0.13.0,<0.14"
colcon-common-extensions = ">=0.3.0,<0.4"
cxx-compiler = ">=2.0.0,<3"
c-compiler = ">=2.0.0,<3"
cmake = ">=4.4.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
ros-lyrical-xacro = ">=2.1.1,<3"
ros-lyrical-joint-state-publisher = ">=2.4.3,<3"
ros-lyrical-joint-state-publisher-gui = ">=2.4.3,<3"
ros-lyrical-mujoco-ros2-control = ">=0.1.2,<0.2"
ros-lyrical-controller-manager = ">=6.10.1,<7"
ros-lyrical-joint-state-broadcaster = ">=6.9.0,<7"
ros-lyrical-joint-trajectory-controller = ">=6.9.0,<7"
ros-lyrical-parallel-gripper-controller = ">=6.9.0,<7"
mujoco-python = ">=3.14.0,<4"
trimesh = ">=5.1.1,<6"
pycollada = ">=0.9.3,<0.10"
ros-lyrical-ros2controlcli = ">=6.10.1,<7"
ros-lyrical-mecanum-drive-controller = ">=6.9.0,<7"

[pypi-dependencies]
obj2mjcf = ">=0.0.25, <0.0.26"
