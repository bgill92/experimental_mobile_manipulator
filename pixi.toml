[workspace]
authors = ["Bilal Gill <5256190+bgill92@users.noreply.github.com>"]
license = "MIT"
license-file = "LICENSE"
channels = ["https://prefix.dev/robostack-lyrical", "conda-forge"]
name = "experimental_mobile_manipulator"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
build = "colcon build --symlink-install --base-paths src"
# Converts the URDF to MJCF in src/emma_simulation/mujoco/; rerun after changing the URDF or mujoco_inputs.xml.
gen-mjcf = { cmd = "bash src/emma_simulation/scripts/gen_mjcf.sh", depends-on = ["build"] }
# Robot model in RViz with joint sliders, no physics. Extra args pass through, e.g. `pixi run display model:=arm`.
display = { cmd = "bash -c 'source install/setup.bash && ros2 launch emma_description display.launch.py \"$@\"' --", depends-on = ["build"] }
# Extra args pass through to the launch file, e.g. `pixi run sim headless:=true`. Builds first so
# newly generated MJCF files are installed.
sim = { cmd = "bash -c 'source install/setup.bash && ros2 launch emma_simulation sim.launch.py \"$@\"' --", depends-on = ["build"] }
# Unit tests (gtest for emma_manipulation and emma_behaviors, pytest and mypy for emma_perception).
test = { cmd = "colcon test --packages-select emma_manipulation emma_behaviors emma_perception && colcon test-result --verbose", depends-on = ["build"] }
# Pick and place of the block the wrist camera finds, in the sim (MuJoCo viewer + RViz + Rerun). Args pass through.
pick-demo = { cmd = "bash -c 'source install/setup.bash && ros2 launch emma_behaviors pick_and_place.launch.py \"$@\"' --", depends-on = ["build"] }
# Headless pick and place; exits 0 only if the behaviour tree succeeds within 240 s. Writes log/pick_check.rrd.
pick-check = { cmd = "bash src/emma_behaviors/scripts/pick_check.sh", depends-on = ["build"] }
# Downloads a MolmoSpaces iTHOR room (once) and writes a scene with emma in it. Args pass through:
# `pixi run molmospaces-scene FloorPlan205 x y yaw --freeze-kg 4`. See src/emma_simulation/README.md.
molmospaces-scene = "python src/emma_simulation/scripts/molmospaces_scene.py"
# The sim in the default MolmoSpaces living room (FloorPlan201). Extra args pass through like `sim`.
sim-living-room = { cmd = "bash -c 'source install/setup.bash && ros2 launch emma_simulation sim.launch.py mujoco_model:=$PIXI_PROJECT_ROOT/src/emma_simulation/mujoco/molmospaces/scenes/ithor/FloorPlan201_emma.xml \"$@\"' --", depends-on = ["molmospaces-scene", "build"] }

[dependencies]
# ROS dependencies of the packages in src/ come from their package.xml files through [dev]; list
# here only tools and libraries no package.xml can name.
ros-lyrical-desktop = ">=0.13.0,<0.14"
colcon-common-extensions = ">=0.3.0,<0.4"
cxx-compiler = ">=2.0.0,<3"
c-compiler = ">=2.0.0,<3"
cmake = ">=4.4.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
mujoco-python = ">=3.14.0,<4"
trimesh = ">=5.1.1,<6"
pycollada = ">=0.9.3,<0.10"
ros-lyrical-ros2controlcli = ">=6.10.1,<7"
librerun-sdk = ">=0.38.1,<0.39"
rerun-sdk = ">=0.38.1,<0.39"
# Built into a conda package by beet's own pixi-build-cmake manifest.
beet = { git = "https://github.com/EzraBrooks/beet", rev = "090bfa4f875cd24554cc7e972b2645878742c317" }
# Upstream Elephant Robotics description packages, built by pixi-build-ros from git.
ros-lyrical-myagv-description = { path = "external_packages/myagv_description" }
ros-lyrical-mycobot-description = { path = "external_packages/mycobot_description" }

# Installs the build, run and test dependencies the package.xml files declare, without building
# the packages; colcon builds them.
[dev]
ros-lyrical-emma-behaviors = { path = "src/emma_behaviors/package.xml" }
ros-lyrical-emma-description = { path = "src/emma_description/package.xml" }
ros-lyrical-emma-manipulation = { path = "src/emma_manipulation/package.xml" }
ros-lyrical-emma-perception = { path = "src/emma_perception/package.xml" }
ros-lyrical-emma-simulation = { path = "src/emma_simulation/package.xml" }

[pypi-dependencies]
obj2mjcf = ">=0.0.25, <0.0.26"
